server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

daraja:
  base-url: ${DARAJA_BASE_URL:https://api.safaricom.co.ke}
  consumer-key: ${DARAJA_CONSUMER_KEY}
  consumer-secret: ${DARAJA_CONSUMER_SECRET}
  shortcode: ${DARAJA_SHORTCODE}
  passkey: ${DARAJA_PASSKEY}
  callback-base-url: ${DARAJA_CALLBACK_BASE_URL}
  initiator-name: ${DARAJA_INITIATOR_NAME}
  security-credential: ${DARAJA_SECURITY_CREDENTIAL}
  callback-allowed-ips: ${DARAJA_CALLBACK_ALLOWED_IPS:}

flutterwave:
  base-url: ${FLW_BASE_URL:https://api.flutterwave.com}
  secret-key: ${FLW_SECRET_KEY}
  webhook-secret-hash: ${FLW_WEBHOOK_SECRET_HASH}

app:
  security:
    require-https: true
  encryption:
    phone-key: ${PHONE_ENCRYPTION_KEY}

logging:
  level:
    com.loot: INFO
