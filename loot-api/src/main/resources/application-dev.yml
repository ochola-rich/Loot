spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lootdb
    username: ${DB_USERNAME:loot}
    password: ${DB_PASSWORD:loot}

daraja:
  base-url: ${DARAJA_BASE_URL:https://sandbox.safaricom.co.ke}
  consumer-key: ${DARAJA_CONSUMER_KEY}
  consumer-secret: ${DARAJA_CONSUMER_SECRET}
  shortcode: ${DARAJA_SHORTCODE:174379}
  passkey: ${DARAJA_PASSKEY}
  callback-base-url: ${DARAJA_CALLBACK_BASE_URL:http://localhost:8080}
  initiator-name: ${DARAJA_INITIATOR_NAME:testapi}
  security-credential: ${DARAJA_SECURITY_CREDENTIAL}

flutterwave:
  base-url: ${FLW_BASE_URL:https://api.flutterwave.com}
  secret-key: ${FLW_SECRET_KEY}
  webhook-secret-hash: ${FLW_WEBHOOK_SECRET_HASH}

app:
  encryption:
    # Dev-only fallback so local setup works without extra config - never used
    # outside this profile. Generate a real key with:
    #   python3 -c "import base64,os; print(base64.b64encode(os.urandom(32)).decode())"
    phone-key: ${PHONE_ENCRYPTION_KEY:MX3nyTDbkALzOiyMXJc3mQVPChZ8D7L8oNrZxD+OWF0=}

logging:
  level:
    com.loot: DEBUG
